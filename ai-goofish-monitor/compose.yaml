services:
  app:
    image: ${APP_IMAGE:-ghcr.io/usagi-org/ai-goofish@sha256:3a22ccea70aefbd5f1a62e2595113a13ec1f6ad5c4f1b9311cca95cda4bd6f30}
    container_name: ai-goofish-monitor-app
    pull_policy: always
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      APP_DATABASE_FILE: /app/data/app.sqlite3
    extra_hosts:
      # 容器通过本项目独立网桥的宿主机地址访问受限 Buddy2api 转发。
      - "host.docker.internal:172.18.0.1"
    mem_limit: 768m
    volumes:
      - ./.env:/app/.env
      - ./data:/app/data
      - ./state:/app/state
      - ./config.json:/app/config.json
      - ./prompts:/app/prompts
      - ./jsonl:/app/jsonl
      - ./logs:/app/logs
      - ./images:/app/images
      - ./price_history:/app/price_history
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
