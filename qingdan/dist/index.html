<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#244b3c"><meta name="description" content="轻单，把每一天过得有条理。属于你的个人任务清单。"><title>轻单 · 个人任务清单</title><link rel="stylesheet" href="style.css"></head><body>
<aside class="sidebar"><a class="brand" href="./"><span class="brand-mark">✓</span>轻单<span class="brand-en">QINGDAN</span></a><div class="space-label">我的空间 <span>PERSONAL</span></div><nav aria-label="任务分类"><button data-filter="all" class="nav active"><span>▤　全部任务</span><b id="nav-all">0</b></button><button data-filter="active" class="nav"><span>◷　待办任务</span><b id="nav-active">0</b></button><button data-filter="important" class="nav"><span>☆　重要任务</span><b id="nav-important">0</b></button><button data-filter="done" class="nav"><span>☑　已完成</span><b id="nav-done">0</b></button></nav><div class="sidebar-note"><div class="sprout">♧</div><strong>慢慢来，也是在前进。</strong><p>把大目标拆成小事，<br>每完成一件，都值得肯定。</p></div><div class="profile"><span class="avatar">我</span><div><strong>个人工作台</strong><small>你的节奏，由你掌握</small></div><span class="online"></span></div></aside>
<main><header><div class="breadcrumb">我的空间 <span>/</span> 任务清单</div><div class="saved" id="saved">○ 正在读取共享清单…</div></header><div class="content"><section class="intro"><div><div class="eyebrow" id="date"></div><h1>把想做的事，<br class="mobile-break">一件件完成<span>。</span></h1><p>清空脑海里的待办，为重要的事留出空间。</p></div><div class="hero-art" aria-hidden="true"><span class="orbit"></span><div class="paper"><i></i><div>✓ <em></em></div><div>✓ <em></em></div><div>○ <em></em></div></div><span class="art-star">✳</span></div></section>
<section class="stats" aria-label="任务概览"><div><span>全部任务</span><strong id="total">0</strong><small>每个想法，都有着落</small></div><div><span><i class="dot amber"></i>待办任务</span><strong id="pending">0</strong><small>专注下一件小事</small></div><div><span><i class="dot green"></i>已完成</span><strong id="completed">0</strong><small>记录你的每一步进展</small></div><div class="progress-stat"><span>完成进度</span><strong id="percent">0<small>%</small></strong><div class="progress"><i id="progress"></i></div></div></section>
<section class="workspace"><div class="section-head"><h2 id="list-title">全部任务 <span id="list-count">0</span></h2><label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索任务…" aria-label="搜索任务"></label></div><form id="add-form"><span class="add-symbol">＋</span><input id="task-input" maxlength="200" placeholder="添加一件想做的事…" aria-label="任务内容" required autocomplete="off"><select id="priority" aria-label="任务优先级"><option value="normal">普通优先级</option><option value="high">高优先级</option><option value="low">低优先级</option></select><button class="add-btn" type="submit">添加任务 <span>↵</span></button></form><div class="list-toolbar"><div class="tabs" aria-label="任务状态"><button class="selected" data-filter="all">全部</button><button data-filter="active">待办</button><button data-filter="done">已完成</button></div><span>按完成状态排列</span></div><div id="tasks"></div><div class="empty" id="empty"><div>✓</div><h3>给今天一个小小的开始</h3><p>在上方记下第一件事，把想法变成行动。</p></div><div class="list-footer"><span id="remaining">还有 0 件任务待完成</span><button id="clear">清理已完成</button></div></section><footer><span>少一点忙乱，多一点从容。</span><span>轻单 · 让每一步都算数</span></footer></div></main>
<dialog id="edit-dialog"><form id="edit-form"><h2>编辑任务</h2><label for="edit-input">任务内容</label><input id="edit-input" maxlength="200" required><div class="dialog-actions"><button type="button" id="cancel-edit">取消</button><button class="add-btn" type="submit">保存修改</button></div></form></dialog><div id="toast" role="status" aria-live="polite"></div><script type="module" src="app.js"></script></body></html>
