# Bounded compressed swap cache for this 2 GiB server. Applied at boot.
# Keep the existing disk swap available as backing storage.
w /sys/module/zswap/parameters/compressor - - - - lz4
w /sys/module/zswap/parameters/zpool - - - - zsmalloc
w /sys/module/zswap/parameters/max_pool_percent - - - - 10
w /sys/module/zswap/parameters/enabled - - - - Y
